# amem enterprise policy example
# Deploy as root-owned: /etc/amem/policy.toml
# Or set AMEM_POLICY_PATH for tests / alternate locations.
#
# Precedence (later wins): defaults → ~/.amem/policy.toml → /etc/amem/policy.toml → AMEM_POLICY_PATH
# Telemetry cannot be enabled. UI bind is forced to loopback.

telemetry = false
ui_enabled = true
ui_bind = "127.0.0.1"
allow_export = false
allowed_platforms = ["cursor", "claude"]

# Empty = any remote. Non-empty = prefix match on normalized origin URL (no https://).
# allowed_remote_hosts = ["github.com/your-org", "gitlab.company.internal"]

# Extra deny regexes (case-insensitive). Builtin secret patterns always apply.
# deny_claim_patterns = ["customer[_-]?ssn", "prod[_-]?password"]

# Optional: auto-apply low-risk draft kinds without Memory approve (empty = never).
# Prefer leaving this empty on managed fleets.
# auto_apply_kinds = ["structure"]

# Skills — reusable procedures agents load on demand from ~/.amem/skills.
# These are instructions an agent will follow, so treat them like code, not notes.
skills_enabled = true
# true = agent writes are staged for review instead of hitting disk.
skill_write_approval = false
# false = stop suggesting skills at session end.
skill_capture = true
