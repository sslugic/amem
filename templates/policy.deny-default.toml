# amem deny-by-default IT policy
# Deploy as root-owned: /etc/amem/policy.toml
# Memory still never leaves the laptop.

telemetry = false
ui_enabled = true
ui_bind = "127.0.0.1"
allow_export = false

# Only the hosts you explicitly allow.
# Ids come from `amem platforms`; aliases (claude-code, vscode, pycharm…) fold in.
# Empty list = allow every known client.
allowed_platforms = ["cursor", "claude"]

# Require a known remote prefix (uncomment and set your org).
# allowed_remote_hosts = ["github.com/your-org"]

# Extra deny regexes on top of builtin secret patterns.
# deny_claim_patterns = ["customer[_-]?ssn"]

# Empty = Memory must approve every draft. Do not auto-apply on managed fleets.
auto_apply_kinds = []

# Skills are instructions agents follow, so nothing reaches disk without a human.
skills_enabled = true
skill_write_approval = true
skill_capture = true
