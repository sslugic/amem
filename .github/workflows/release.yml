name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack:check
      # Note: step `env` is not visible to `if` — check the secret itself.
      - name: publish
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: skip publish (no token)
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN is not set — pack is ready, publish skipped. See docs/npm-release.md."
