name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish to GitHub Packages (for example v0.4.1)"
        required: true

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: shop dependencies (shop tests)
        run: npm ci --prefix shop
      - run: npm test
      - run: npm run pack:check
      - name: publish
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set — pack is ready, publish skipped. See docs/npm-release.md."
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # GitHub Packages only accepts a scope that matches the owner, so the same
  # build is published there as @sslugic/amem. npm stays @iamem/amem.
  github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@sslugic"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: publish @sslugic/amem
        run: |
          npm pkg set name=@sslugic/amem
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm pkg delete publishConfig.access
          npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
