name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish to GitHub Packages (for example v0.4.1)"
        required: true

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: shop dependencies (shop tests)
        run: npm ci --prefix shop
      - run: npm test
      - run: npm run pack:check
      - name: publish
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set — pack is ready, publish skipped. See docs/npm-release.md."
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # GitHub Packages only accepts a scope that matches the owner, so the same
  # build is published there as @sslugic/amem. npm stays @iamem/amem.
  github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@sslugic"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: publish @sslugic/amem
        run: |
          npm pkg set name=@sslugic/amem
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm pkg delete publishConfig.access
          npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # List the release on the official MCP Registry (registry.modelcontextprotocol.io).
  # Auth is GitHub OIDC for the io.github.sslugic namespace; the registry checks the
  # npm package's mcpName, so this runs after the npm publish.
  mcp-registry:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: set server.json version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version=$v | .packages[0].version=$v' server.json > server.tmp && mv server.tmp server.json
      - name: wait for npm
        run: |
          for i in $(seq 1 30); do
            npm view "@iamem/amem@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "npm version not visible yet" && exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  # A GitHub Release per tag: Glama (and anyone watching releases) rebuilds from these,
  # and npm tags alone never create one.
  github-release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: create release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
