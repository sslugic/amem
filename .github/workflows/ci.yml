name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: shop dependencies (shop tests)
        run: npm ci --prefix shop
      - run: npm test
      - run: npm run pack:check
      - name: native module loads
        run: node -e "import('better-sqlite3').then((m) => { const Database = m.default; new Database(':memory:').close(); console.log('better-sqlite3 ok'); })"

  # Package the desktop app on each OS and run amem through it (desktop/scripts/smoke.mjs),
  # so a packaging problem shows up here rather than at release time.
  desktop:
    name: desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm ci --prefix desktop
      - name: package (unpacked, unsigned)
        run: node desktop/scripts/dist.mjs ${{ matrix.target }} --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: run amem through the packaged app
        run: node desktop/scripts/smoke.mjs
