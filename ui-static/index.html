<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>amem</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand-block">
          <div class="brand">amem</div>
          <div class="repo-switcher">
            <select id="repoSelect" aria-label="Repository"></select>
            <button class="btn secondary small" id="addRepoBtn" type="button">Add repo</button>
          </div>
        </div>
        <nav class="tabs" id="tabs">
          <button data-tab="setup" class="active">Setup</button>
          <button data-tab="brain">Brain</button>
          <button data-tab="stats">Stats</button>
        </nav>
        <div class="privacy">Local only · 127.0.0.1</div>
      </header>
      <div id="addRepoPanel" class="add-repo-panel hidden">
        <label for="addRepoPath">Path to another git repo on this machine</label>
        <div class="add-repo-row">
          <input id="addRepoPath" type="text" placeholder="/Users/you/projects/other-repo" />
          <button class="btn" id="addRepoGo" type="button">Open setup</button>
          <button class="btn secondary" id="addRepoCancel" type="button">Cancel</button>
        </div>
      </div>
      <main id="main"></main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
