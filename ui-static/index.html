<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>amem</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="side-nav" id="sideNav">
        <div class="brand-row">
          <button class="brand" id="brandBtn" type="button">amem</button>
          <span class="brand-tag">memory for your agents</span>
        </div>

        <div class="side-scope">
          <label class="side-scope-label" for="repoSelect">Showing</label>
          <div class="repo-switcher">
            <select id="repoSelect" aria-label="Which memory to show"></select>
          </div>
          <div class="side-scope-actions">
            <button class="linkish small hidden" id="renameWsBtn" type="button">Rename</button>
            <button class="linkish small" id="addRepoBtn" type="button">+ Add a project</button>
          </div>
        </div>

        <nav class="side-tabs" id="tabs" aria-label="Primary">
          <button type="button" data-tab="dashboard">
            <span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z"/></svg></span>
            <span class="nav-label">Home</span>
          </button>
          <button type="button" data-tab="brain">
            <span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3c3.9 0 7 1.3 7 3s-3.1 3-7 3-7-1.3-7-3 3.1-3 7-3zm-7 5.5c0 1.7 3.1 3 7 3s7-1.3 7-3M3 11c0 1.7 3.1 3 7 3s7-1.3 7-3M3 6v8c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/></svg></span>
            <span class="nav-label">Memory</span>
          </button>
          <button type="button" data-tab="tasks">
            <span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h2v2H4zm4 0.5h8M4 9h2v2H4zm4 .5h8M4 13h2v2H4zm4 .5h8"/></svg></span>
            <span class="nav-label">Tasks</span>
          </button>
          <button type="button" data-tab="skills">
            <span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h8l2 2v12H5zM8 8h4M8 11h4M8 14h2"/></svg></span>
            <span class="nav-label">Skills</span>
          </button>
          <button type="button" data-tab="analytics">
            <span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16h14M5 13V9m4 4V5m4 8v-6"/></svg></span>
            <span class="nav-label">Insights</span>
          </button>
          <button type="button" data-tab="welcome">
            <span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 3 2.1 4.4 4.9.7-3.5 3.4.8 4.8L10 14l-4.3 2.3.8-4.8L3 8.1l4.9-.7z"/></svg></span>
            <span class="nav-label">Plans</span>
          </button>
        </nav>

        <div class="side-footer">
          <button type="button" class="side-foot-btn" data-tab="setup" id="settingsNavBtn">
            <span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 7a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0-4 1.2 2 2.3-.5.5 2.3 2 1.2-1.2 2 1.2 2-2 1.2-.5 2.3-2.3-.5L10 17l-1.2-2-2.3.5-.5-2.3-2-1.2 1.2-2-1.2-2 2-1.2.5-2.3 2.3.5z"/></svg></span><span class="nav-label">Settings</span>
          </button>
          <button class="side-foot-btn" id="vaultToggle" type="button">
            <span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 9V7a4 4 0 0 1 8 0v2M5 9h10v8H5z"/></svg></span><span class="nav-label">Lock &amp; backup</span>
          </button>
          <button class="side-foot-btn" id="personalBtn" type="button">
            <span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-6 7a6 6 0 0 1 12 0"/></svg></span><span class="nav-label">Personal memory</span>
          </button>
          <p class="side-status" id="vaultChips"></p>
        </div>
      </aside>

      <div class="app-main">
        <header class="top-bar" id="topBar">
          <div class="top-search-wrap" id="topSearchWrap">
            <input
              id="brainSearch"
              class="top-search"
              type="search"
              placeholder="Search your memory…"
              autocomplete="off"
            />
            <button class="btn secondary small top-mem-only hidden" type="button" id="tryRetrievalBtn" title="See exactly what an agent would get for this question">
              Test as a question
            </button>
          </div>
          <div class="top-actions" id="topActions">
            <label class="autostart brain-auto top-mem-only hidden" id="autoApplyLabel" title="Save new captures from chats without asking you first">
              <input type="checkbox" id="autoApplyAll" /> Save new captures automatically
            </label>
            <button class="btn secondary small top-mem-only hidden" type="button" id="showdownToggle">
              Compare search modes
            </button>
            <button class="btn secondary small top-mem-only hidden" type="button" id="rulesSyncBtn">
              Sync pinned → rules
            </button>
          </div>
        </header>

        <div id="vaultPanel" class="vault-panel hidden">
          <div class="vault-panel-inner">
            <div class="vault-head">
              <div>
                <strong>Lock &amp; backup</strong>
                <p class="note">Everything stays on this machine. Nothing is uploaded.</p>
              </div>
              <button class="btn small secondary" id="vaultCloseBtn" type="button">Close</button>
            </div>

            <div class="vault-grid">
              <section class="vault-card" aria-labelledby="vaultBackupTitle">
                <header class="vault-card-head">
                  <h3 id="vaultBackupTitle">Backups</h3>
                  <span class="vault-badge" id="vaultBackupBadge"></span>
                </header>
                <p class="vault-line" id="vaultLastBackup">Loading…</p>
                <div class="vault-row">
                  <button class="btn" id="vaultBackupBtn" type="button">Back up now</button>
                </div>
                <div class="vault-row vault-schedule">
                  <label for="vaultHour">Daily backup at</label>
                  <select id="vaultHour"></select>
                  <button class="btn small" id="vaultScheduleBtn" type="button">Turn on</button>
                  <button class="btn small secondary" id="vaultUnscheduleBtn" type="button">Turn off</button>
                </div>
                <p class="note" id="vaultScheduleNote"></p>
              </section>

              <section class="vault-card" aria-labelledby="vaultLockTitle">
                <header class="vault-card-head">
                  <h3 id="vaultLockTitle">Encryption</h3>
                  <span class="vault-badge" id="vaultLockBadge"></span>
                </header>
                <p class="vault-line" id="vaultLockLine"></p>
                <div class="vault-row">
                  <input id="vaultPass" type="password" autocomplete="new-password" placeholder="Passphrase" />
                </div>
                <div class="vault-row" id="vaultPassConfirmRow">
                  <input id="vaultPassConfirm" type="password" autocomplete="new-password" placeholder="Type it again" />
                </div>
                <div class="vault-row">
                  <button class="btn" id="vaultLockBtn" type="button">Encrypt and lock</button>
                  <button class="btn" id="vaultUnlockBtn" type="button">Unlock</button>
                </div>
                <p class="note" id="vaultLockNote">There is no recovery if you forget the passphrase. With a passphrase entered, <b>Back up now</b> also encrypts the backup.</p>
              </section>

              <section class="vault-card vault-card-wide" aria-labelledby="vaultRestoreTitle">
                <header class="vault-card-head">
                  <h3 id="vaultRestoreTitle">Restore</h3>
                </header>
                <div class="vault-row">
                  <select id="vaultRestorePick" aria-label="Backup to restore"></select>
                  <input id="vaultRestorePath" class="hidden" type="text" placeholder="/path/to/amem-backup.db or .db.enc" aria-label="Backup file path" />
                  <button class="btn secondary" id="vaultRestoreBtn" type="button">Restore…</button>
                </div>
                <div class="vault-confirm hidden" id="vaultRestoreConfirm" role="alertdialog" aria-labelledby="vaultRestoreConfirmText">
                  <p id="vaultRestoreConfirmText"></p>
                  <div class="vault-row">
                    <button class="btn" id="vaultRestoreYes" type="button">Replace memory</button>
                    <button class="btn secondary" id="vaultRestoreNo" type="button">Cancel</button>
                  </div>
                </div>
              </section>
            </div>

            <p class="vault-status" id="vaultStatusMsg" role="status" aria-live="polite"></p>
          </div>
        </div>

        <div id="embedIndexBanner" class="embed-index-banner hidden" role="status"></div>

        <div id="addRepoPanel" class="add-repo-panel hidden">
          <label for="addRepoPath">Path to another git repo on this machine</label>
          <div class="add-repo-row">
            <input id="addRepoPath" type="text" placeholder="/Users/you/projects/other-repo" />
            <button class="btn" id="addRepoGo" type="button">Open setup</button>
            <button class="btn secondary" id="addRepoCancel" type="button">Cancel</button>
          </div>
        </div>

        <div class="workspace" id="workspace">
          <main id="main"></main>
          <aside class="right-panel" id="rightPanel" aria-label="Insights"></aside>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var TABS = ["setup", "dashboard", "brain", "analytics", "tasks", "skills"];
        var params = new URLSearchParams(location.search);
        var fromUrl = params.get("tab");
        var tab = "dashboard";
        if (fromUrl === "stats") {
          tab = "analytics";
        } else if (TABS.indexOf(fromUrl) !== -1) {
          tab = fromUrl;
        }
        document.querySelectorAll("button[data-tab]").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-tab") === tab);
        });
      })();
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
